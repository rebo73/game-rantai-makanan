<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPI Rantai Makanan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: flex-start;
      padding: 20px;
    }
    .container {
      background: #fff; border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 820px; width: 100%; padding: 35px;
    }
    h1 { color: #2e7d32; text-align: center; margin-bottom: 8px; font-size: 1.6rem; }
    .subtitle { text-align: center; color: #666; margin-bottom: 28px; font-size: 0.95rem; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; }
    input[type="text"], input[type="number"] {
      width: 100%; padding: 13px 15px; border: 2px solid #ddd;
      border-radius: 10px; font-size: 1rem; transition: border 0.3s;
    }
    input:focus { border-color: #4caf50; outline: none; }
    .btn {
      display: block; width: 100%; padding: 14px; background: #4caf50;
      color: #fff; border: none; border-radius: 10px; font-size: 1.1rem;
      font-weight: 600; cursor: pointer; margin-top: 10px;
      transition: background 0.3s, transform 0.1s;
    }
    .btn:hover { background: #388e3c; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #a5d6a7; cursor: not-allowed; }
    .soal-card { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
    .soal-card:last-child { border-bottom: none; }
    .soal-teks { font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
    .opsi-label {
      display: flex; align-items: flex-start; padding: 12px 14px;
      margin-bottom: 8px; border: 2px solid #e0e0e0; border-radius: 10px;
      cursor: pointer; transition: background 0.2s, border 0.2s;
    }
    .opsi-label:hover { background: #f1f8e9; border-color: #a5d6a7; }
    .opsi-label input { margin-right: 12px; margin-top: 4px; transform: scale(1.3); }
    .opsi-label.selected { background: #e8f5e9; border-color: #4caf50; }
    .progress-bar {
      height: 10px; background: #e0e0e0; border-radius: 10px;
      margin-bottom: 12px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, #66bb6a, #43a047);
      border-radius: 10px; transition: width 0.4s;
    }
    .skor-box {
      text-align: center; padding: 30px; background: #e8f5e9;
      border-radius: 15px; margin-top: 20px;
    }
    .skor-angka { font-size: 3.5rem; font-weight: 700; color: #2e7d32; }
    .skor-label { color: #555; margin-top: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">

    <!-- HALAMAN 1: IDENTITAS -->
    <div id="halamanIdentitas">
      <h1>🌿 MPI Rantai Makanan</h1>
      <p class="subtitle">Harmoni dalam Ekosistem — IPAS Kelas 5</p>
      <div class="form-group">
        <label for="inputNama">Nama Lengkap</label>
        <input type="text" id="inputNama" placeholder="Tulis nama lengkapmu" required>
      </div>
      <div class="form-group">
        <label for="inputAbsen">Nomor Absen</label>
        <input type="number" id="inputAbsen" placeholder="Contoh: 12" min="1" max="50" required>
      </div>
      <button class="btn" id="btnMulai">Mulai Ulangan</button>
      <p style="text-align:center; margin-top:15px; font-size:0.85rem; color:#888;">
        Pastikan nama dan nomor absen sudah benar sebelum memulai.
      </p>
    </div>

    <!-- HALAMAN 2: KUIS -->
    <div id="halamanKuis" class="hidden">
      <h1>📝 Soal Ulangan</h1>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
      <p style="text-align:center; margin-bottom:18px; color:#555; font-size:0.9rem;">
        Terjawab: <span id="terjawab">0</span> / <span id="totalSoal">0</span>
      </p>
      <div id="daftarSoal"></div>
      <button class="btn" id="btnSelesai" disabled>Kumpulkan Jawaban</button>
    </div>

    <!-- HALAMAN 3: HASIL -->
    <div id="halamanHasil" class="hidden">
      <h1>🎉 Ulangan Selesai!</h1>
      <div class="skor-box">
        <div class="skor-angka" id="skorAngka">0</div>
        <div class="skor-label" id="skorLabel">dari 25 soal</div>
        <p style="margin-top:15px; font-size:1.1rem;" id="pesanSkor"></p>
      </div>
      <p style="text-align:center; margin-top:20px; color:#666;">
        Hasil sudah otomatis tersimpan. Terima kasih, <strong id="namaSiswa"></strong>!
      </p>
    </div>

  </div>

  <script>
    let soalData = [], jawabanSiswa = {}, namaSiswa = '', absenSiswa = '';

    window.addEventListener('load', function() {
      google.script.run
        .withSuccessHandler(function(data) {
          soalData = data;
          document.getElementById('totalSoal').textContent = soalData.length;
          document.getElementById('skorLabel').textContent = 'dari ' + soalData.length + ' soal';
        })
        .withFailureHandler(function(err) { alert('Gagal memuat soal: ' + err.message); })
        .getSoal();
    });

    document.getElementById('btnMulai').addEventListener('click', function() {
      const nama = document.getElementById('inputNama').value.trim();
      const absen = document.getElementById('inputAbsen').value.trim();
      if (!nama) { alert('Nama tidak boleh kosong.'); return; }
      if (!absen) { alert('Nomor absen tidak boleh kosong.'); return; }
      if (soalData.length === 0) { alert('Soal belum termuat. Muat ulang halaman.'); return; }
      namaSiswa = nama; absenSiswa = absen;
      document.getElementById('halamanIdentitas').classList.add('hidden');
      document.getElementById('halamanKuis').classList.remove('hidden');
      tampilkanSoal();
    });

    function tampilkanSoal() {
      const container = document.getElementById('daftarSoal');
      container.innerHTML = '';
      soalData.forEach(function(soal, index) {
        const card = document.createElement('div');
        card.className = 'soal-card';
        const teks = document.createElement('div');
        teks.className = 'soal-teks';
        teks.textContent = (index + 1) + '. ' + soal.pertanyaan;
        card.appendChild(teks);
        ['A','B','C','D'].forEach(function(huruf) {
          const label = document.createElement('label');
          label.className = 'opsi-label';
          label.innerHTML = '<input type="radio" name="soal_' + soal.no + '" value="' + huruf + '">' +
                            '<span><strong>' + huruf + '.</strong> ' + soal.opsi[huruf] + '</span>';
          label.querySelector('input').addEventListener('change', function() {
            jawabanSiswa[soal.no] = huruf;
            const semua = card.querySelectorAll('.opsi-label');
            semua.forEach(function(l){ l.classList.remove('selected'); });
            label.classList.add('selected');
            updateProgress();
          });
          card.appendChild(label);
        });
        container.appendChild(card);
      });
      updateProgress();
    }

    function updateProgress() {
      const terjawab = Object.keys(jawabanSiswa).length;
      const total = soalData.length;
      document.getElementById('progressFill').style.width = (terjawab/total*100) + '%';
      document.getElementById('terjawab').textContent = terjawab;
      document.getElementById('btnSelesai').disabled = (terjawab < total);
    }

    document.getElementById('btnSelesai').addEventListener('click', function() {
      if (!confirm('Semua soal sudah terjawab. Kumpulkan jawaban sekarang?')) return;
      let skor = 0;
      soalData.forEach(function(soal) {
        if (jawabanSiswa[soal.no] === soal.kunci) skor++;
      });
      const btn = document.getElementById('btnSelesai');
      btn.disabled = true; btn.textContent = 'Menyimpan...';
      google.script.run
        .withSuccessHandler(function() { tampilkanHasil(skor); })
        .withFailureHandler(function(err) {
          alert('Gagal menyimpan: ' + err.message);
          btn.disabled = false; btn.textContent = 'Kumpulkan Jawaban';
        })
        .simpanHasil(namaSiswa, absenSiswa, skor, soalData.length);
    });

    function tampilkanHasil(skor) {
      document.getElementById('halamanKuis').classList.add('hidden');
      document.getElementById('halamanHasil').classList.remove('hidden');
      document.getElementById('skorAngka').textContent = skor;
      document.getElementById('namaSiswa').textContent = namaSiswa;
      const persen = (skor / soalData.length) * 100;
      let pesan = '';
      if (persen >= 90) pesan = 'Luar biasa! 🌟';
      else if (persen >= 75) pesan = 'Bagus sekali! 👍';
      else if (persen >= 60) pesan = 'Cukup baik, terus belajar! 💪';
      else pesan = 'Jangan menyerah, ayo pelajari lagi! 📚';
      document.getElementById('pesanSkor').textContent = pesan;
    }
  </script>
</body>
</html>
